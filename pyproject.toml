[build-system]
requires = ["scikit-build-core>=0.3.3", "pybind11", "cmake"]
build-backend = "scikit_build_core.build"

[project]
name = "simple_pybind11_multiplier_test"
version = "0.1.0"
description = "A simple pybind11 example: a stateful C++ multiplier exposed to Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NewbieeSaibot" }]
keywords = ["pybind11", "C++", "example"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/NewbieeSaibot/simple_pybind11_multiplier_test"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
